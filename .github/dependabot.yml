# Weekly pull requests that update the lockfiles and the workflows' actions.
# Minor and patch updates come grouped in one pull request per ecosystem;
# major updates come one by one, as they may need code changes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Babel 8 needs @babel/preset-env 8 and Jest 30 (babel-jest) at the same time:
      # a planned migration, not a single bump.
      - dependency-name: '@babel/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      composer:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
