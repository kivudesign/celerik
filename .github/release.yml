# Categories of the generated release notes (gh release create --generate-notes).
# Pull requests are labeled from their title by .github/workflows/pr-labels.yml.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: New features
      labels: [feature]
    - title: Accessibility
      labels: [accessibility]
    - title: Bug fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Maintenance
      labels: [maintenance]
    - title: Other changes
      labels: ['*']
