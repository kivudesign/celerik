name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        deps: [locked]
        include:
          # The lowest versions composer.json allows, so its constraints stay honest.
          - php: '8.2'
            deps: lowest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
      - if: matrix.deps == 'locked'
        run: composer install --no-interaction --no-progress
      - if: matrix.deps == 'lowest'
        run: composer update --prefer-lowest --no-interaction --no-progress
      - run: composer lint
      - run: composer test

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The runner's preinstalled Google Chrome: no browser download, which can hang.
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run docs:build
      - run: npm run test:site
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-test-results
          path: test-results/
          retention-days: 7

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The runner's preinstalled Google Chrome: no browser download, which can hang.
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
